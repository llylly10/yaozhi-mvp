# 药知 MVP · 云服务器单机构建
# 用法（在云服务器上执行）：
#   git clone <repo> && cd yaozhi-mvp
#   bash deploy/cloud/setup.sh
# 说明：
#   - backend  容器：跑 FastAPI（构建上下文=仓库根，已含 3MB 种子 JSON）
#   - nginx    容器：托管 frontend/dist 静态站 + 反代 /api -> backend:8000
#   - 前后端同源，无需跨域，无需 Cloudflare Function
services:
  backend:
    build:
      context: ../..          # 仓库根（Dockerfile 相对仓库根解析 backend/ 与 corpus/）
      dockerfile: backend/Dockerfile
    # 云部署敏感配置（模型 Key 等）：放在仓库外固定路径，代码覆盖部署时不丢；不入库
    env_file:
      - /home/admin/yaozhi_env
    environment:
      - PORT=8000
      - SEED_ON_STARTUP=true
      # db 放独立数据目录 /srv/data（named volume 挂载点），避免 volume 遮蔽镜像代码
      # env 前缀必须是 YAOZHI_（Settings.env_prefix），否则 config 回退默认库
      - YAOZHI_DATABASE_URL=sqlite:////srv/data/yaozhi_w1.db
      # 鉴权（2026-09-28）：公网部署必须开启 token 校验；管理密钥（YAOZHI_ADMIN_KEY）
      # 与演示邀请码（YAOZHI_INVITE_CODE）请加入 /home/admin/yaozhi_env（不入库），
      # 未配置管理密钥时 /admin/* 与 /eval/run 开放且启动日志会告警。
      - YAOZHI_AUTH_REQUIRED=1
      # 语义向量路（2026-09-29 启用，api 后端）：检索评测 hit@5 32.8%→88.4%（250 题弱标注，
      # eval/retrieval_eval.py --backend api）。查询编码走 DashScope embedding API（每次约
      # 0.0005 元），服务器零模型内存——1.6G 小机无需升配；页向量缓存已随镜像入库，
      # API 失败自动退回 BM25 双路。
      - YAOZHI_RAG_SEMANTIC_ENABLED=true
      - YAOZHI_RAG_SEMANTIC_BACKEND=api
      - YAOZHI_FASTEMBED_CACHE=/srv/data/fastembed
    # 宿主机 DNS 走 systemd-resolved stub(127.0.0.53)，容器继承后无法解析外网域名
    # （表现为调外部模型报 Connection error / name resolution failure）。
    # 且公共 DNS(223.5.5.5/8.8.8.8) 从容器 bridge 网络 UDP:53 不可达，
    # 必须用宿主机实际的阿里云内网 DNS（见 resolvectl status）。
    dns:
      - 100.100.2.136
      - 100.100.2.138
    volumes:
      - backend_data:/srv/data   # 仅持久化 SQLite，不遮蔽镜像 /srv 代码
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz'); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
    ports:
      - "80:80"
      # 配好 HTTPS 证书后取消下面一行注释，并参考 README 改 nginx.conf 监听 443
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  backend_data:
