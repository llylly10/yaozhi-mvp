services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: yaozhi
      POSTGRES_PASSWORD: yaozhi_dev
      POSTGRES_DB: yaozhi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaozhi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      YAOZHI_DATABASE_URL: postgresql+psycopg://yaozhi:yaozhi_dev@db:5432/yaozhi
      YAOZHI_MODEL_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
